<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テニプリDB</title>
<script src="https://cdn.staticfile.net/vue/3.3.4/vue.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f0;padding:10px}
.box{background:#fff;border:3px solid #000;padding:10px;margin-bottom:10px;box-shadow:4px 4px 0 rgba(0,0,0,0.2)}
h2{background:#000;color:#fff;padding:5px 10px;display:inline-block;font-size:14px;margin-bottom:10px}
input,textarea{width:100%;border:2px solid #000;padding:5px;margin:2px 0;font-size:13px}
button{background:#fff;border:2px solid #000;padding:5px 10px;font-weight:bold;cursor:pointer;box-shadow:2px 2px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #000;display:flex;justify-content:space-around;padding:5px}
.nav button{background:none;border:none;box-shadow:none;font-size:12px}
.nav button.on{font-weight:bold;color:#e74c3c}
.main{padding-bottom:60px}
</style>
</head>
<body>
<div id="app">
<div class="main">
  <h1 style="font-size:24px;margin-bottom:10px">テニプリ 公式書DB</h1>
  
  <!-- 顶部按钮 -->
  <div style="display:flex;gap:5px;margin-bottom:10px">
    <button @click="nav='schools'" :style="nav==='schools'?'background:#000;color:#fff':''">🏫学校</button>
    <button @click="nav='chars'" :style="nav==='chars'?'background:#000;color:#fff':''">🎾選手</button>
    <button @click="save" style="margin-left:auto">💾保存</button>
  </div>
  
  <!-- 学校页面 -->
  <div v-if="nav==='schools'">
    <div class="box">
      <h2>学校リスト</h2>
      <div v-for="s in schools" :key="s.id" @click="selSchool=s" style="padding:8px;border:2px solid #000;margin:3px 0;cursor:pointer" :style="selSchool?.id===s.id?'background:#000;color:#fff':''">
        {{s.name}}
      </div>
    </div>
    
    <div v-if="selSchool" class="box">
      <h2>{{selSchool.name}}</h2>
      <input v-model="selSchool.captain" placeholder="部長">
      <input v-model="selSchool.motto" placeholder="校訓">
      <textarea v-model="selSchool.description" rows="3" placeholder="概要"></textarea>
      <button @click="addChar(selSchool.id)">+選手追加</button>
      <div class="grid" style="margin-top:10px">
        <div v-for="c in getChars(selSchool.id)" :key="c.id" @click="selChar=c;nav='chars'" class="box" style="text-align:center;padding:5px">
          <div style="width:50px;height:50px;background:#ddd;margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:bold">{{c.name[0]}}</div>
          <div style="font-size:12px;font-weight:bold">{{c.name}}</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 选手页面 -->
  <div v-if="nav==='chars'">
    <div v-if="!selChar">
      <div v-for="s in schools" :key="s.id" class="box">
        <h2>{{s.name}}</h2>
        <div v-for="c in getChars(s.id)" :key="c.id" @click="selChar=c" style="padding:5px;border:2px solid #000;margin:2px 0;cursor:pointer">
          {{c.name}}
        </div>
      </div>
    </div>
    
    <div v-if="selChar" class="box">
      <button @click="selChar=null">←戻る</button>
      <h2 style="margin-top:10px">{{selChar.name}}</h2>
      <input v-model="selChar.baseProfile.birthday" placeholder="生年月日">
      <input v-model="selChar.baseProfile.height" placeholder="身長">
      <input v-model="selChar.baseProfile.playStyle" placeholder="プレースタイル">
      <textarea v-model="selChar.sections.personality" rows="3" placeholder="性格"></textarea>
      <div style="margin-top:10px">
        <div v-for="(item,i) in selChar.itemsCheck" :key="i" style="display:flex;gap:5px;margin:3px 0">
          <input v-model="item.name" placeholder="物品" style="flex:1">
          <button @click="selChar.itemsCheck.splice(i,1)">×</button>
        </div>
        <button @click="selChar.itemsCheck.push({name:'',desc:''})">+物品</button>
      </div>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="nav">
  <button @click="nav='schools'" :class="nav==='schools'?'on':''">🏫<br>学校</button>
  <button @click="nav='chars'" :class="nav==='chars'?'on':''">🎾<br>選手</button>
  <button @click="showList=true">☰<br>リスト</button>
</div>
</div>

    ]);
    const chars=ref(JSON.parse(localStorage.getItem('t_c')||'[]'));
    const selSchool=ref(null);

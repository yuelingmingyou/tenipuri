<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テニプリDB</title>
<script src="https://unpkg.com/vue@3.3.4/dist/vue.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP","Hiragino Sans GB",sans-serif;background:#f5f5f0;padding:10px;padding-bottom:70px}
.box{background:#fff;border:3px solid #000;padding:10px;margin-bottom:10px;box-shadow:4px 4px 0 rgba(0,0,0,0.2)}
h2{background:#000;color:#fff;padding:5px 10px;display:inline-block;font-size:14px;margin-bottom:10px}
h3{font-size:12px;font-weight:bold;border-left:3px solid #000;padding-left:5px;margin:10px 0 5px}
input,textarea{width:100%;border:2px solid #000;padding:5px;margin:2px 0;font-size:13px;font-family:inherit}
input:focus,textarea:focus{outline:none;background:#fffef5;box-shadow:3px 3px 0 #000}
button{background:#fff;border:2px solid #000;padding:5px 10px;font-weight:bold;cursor:pointer;box-shadow:2px 2px 0 #000;font-size:12px}
button:active{transform:translate(2px,2px);box-shadow:none}
.mbtn-b{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #000;display:flex;justify-content:space-around;padding:5px;z-index:100}
.nav button{background:none;border:none;box-shadow:none;font-size:12px;text-align:center}
.nav button.on{font-weight:bold;color:#e74c3c}
.nav button .ic{font-size:1.3rem;display:block}
.profile-row{display:flex;align-items:center;gap:5px;margin:4px 0;font-size:13px;flex-wrap:wrap}
.profile-row .label{font-weight:bold;min-width:80px;flex-shrink:0}
.profile-row input{flex:1;min-width:120px}
.version-tag{font-size:10px;color:#666;background:#f0f0f0;padding:1px 4px;border:1px solid #999}
.qa-box{margin:8px 0;padding:10px;border:2px solid #000;background:#fff}
.qa-q{color:#e74c3c;font-weight:bold;font-size:16px;margin-bottom:3px}
.qa-a{color:#3498db;margin-top:5px}
.comment-box{margin:5px 0;padding:8px;background:#f8f8f8;border:2px solid #ddd;position:relative}
.comment-box .author{font-weight:bold;font-size:12px;color:#333;margin-bottom:3px}
.comment-box .source{font-size:10px;color:#999;text-align:right}
.section-divider{height:2px;background:repeating-linear-gradient(90deg,#000,#000 5px,transparent 5px,transparent 10px);margin:15px 0}
[v-cloak]{display:none!important}
</style>
</head>
<body>
<div id="app" v-cloak>
<!-- 顶部导航 -->
<div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap">
  <button @click="nav='schools'" :class="nav==='schools'?'mbtn-b':''">🏫学校</button>
  <button @click="nav='chars'" :class="nav==='chars'?'mbtn-b':''">🎾選手</button>
  <button @click="save" style="margin-left:auto">💾保存</button>
</div>

<!-- 学校页面 -->
<div v-if="nav==='schools'">
  <div class="box">
    <h2>学校リスト</h2>
    <div v-for="s in schools" :key="s.id" @click="selSchool=s" style="padding:8px;border:2px solid #000;margin:3px 0;cursor:pointer" :style="selSchool?.id===s.id?'background:#000;color:#fff':''">
      {{s.name}}
    </div>
  </div>
  
  <div v-if="selSchool" class="box">
    <h2>{{selSchool.name}}</h2>
    <input v-model="selSchool.captain" placeholder="部長">
    <input v-model="selSchool.motto" placeholder="校訓">
    <textarea v-model="selSchool.description" rows="3" placeholder="概要"></textarea>
    <button @click="addChar(selSchool.id)">+選手追加</button>
    <div class="grid" style="margin-top:10px">
      <div v-for="c in getChars(selSchool.id)" :key="c.id" @click="selChar=c;nav='chars'" class="box" style="text-align:center;padding:5px;cursor:pointer">
        <div style="width:50px;height:50px;background:#ddd;margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px">{{c.name[0]}}</div>
        <div style="font-size:12px;font-weight:bold;margin-top:3px">{{c.name}}</div>
      </div>
    </div>
  </div>
</div>

<!-- 选手列表页面 -->
<div v-if="nav==='chars' && !selChar">
  <div v-for="s in schools" :key="s.id" class="box">
    <h2>{{s.name}}</h2>
    <div v-for="c in getChars(s.id)" :key="c.id" @click="selChar=c" style="padding:5px;border:2px solid #000;margin:2px 0;cursor:pointer;display:flex;align-items:center;gap:8px">
      <div style="width:40px;height:40px;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:bold">{{c.name[0]}}</div>
      <span>{{c.name}}</span>
    </div>
  </div>
</div>
<!-- 选手详细编辑页面 -->
<div v-if="nav==='chars' && selChar" style="padding-bottom:60px">
  <button @click="selChar=null" style="margin-bottom:10px">← 戻る</button>
  
  <!-- 基础信息 -->
  <div class="box">
    <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">
      <div style="width:80px;height:80px;background:#ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;border:3px solid #000">
        {{selChar.name[0]}}
      </div>
      <div>
        <h2 style="margin:0">{{selChar.name}}</h2>
        <div style="font-size:12px;color:#666">{{getSchoolName(selChar.schoolId)}}</div>
      </div>
    </div>
    
    <!-- 固定基础项目 -->
    <div v-for="(label, key) in baseProfileLabels" :key="key" class="profile-row">
      <span class="label">{{label}}：</span>
      <!-- 多版本项目 -->
      <div v-if="Array.isArray(selChar.baseProfile[key])" style="flex:1">
        <div v-for="(item, idx) in selChar.baseProfile[key]" :key="idx" style="display:flex;gap:5px;margin:2px 0;align-items:center">
          <input v-model="item.content" placeholder="内容" style="flex:1">
          <input v-model="item.version" placeholder="10.5" style="width:60px">
          <button @click="selChar.baseProfile[key].splice(idx,1)" style="padding:2px 6px">×</button>
        </div>
        <button @click="selChar.baseProfile[key].push({content:'',version:''})" style="font-size:11px;margin-top:2px">+版本追加</button>
      </div>
      <!-- 单版本项目 -->
      <input v-else v-model="selChar.baseProfile[key]" :placeholder="label" style="flex:1">
    </div>
  </div>

  <!-- 性格分析 -->
  <div class="box">
    <h2>性格分析</h2>
    <textarea v-model="selChar.sections.personality" rows="4" placeholder="性格特点、行为模式、心理分析..."></textarea>
  </div>

  <!-- 他人评价 -->
  <div class="box">
    <h2>他人評価</h2>
    <div v-for="(c, i) in selChar.sections.othersComments" :key="i" class="comment-box">
      <button @click="selChar.sections.othersComments.splice(i,1)" style="position:absolute;top:2px;right:2px;padding:2px 6px;font-size:10px">×</button>
      <input v-model="c.author" placeholder="評価者" style="font-weight:bold;width:150px">
      <textarea v-model="c.text" rows="2" placeholder="コメント..."></textarea>
      <input v-model="c.source" placeholder="出处（如：POT公式書20.5）" style="font-size:11px;color:#666">
    </div>
    <button @click="selChar.sections.othersComments.push({author:'',text:'',source:''})" style="margin-top:5px">+評価追加</button>
  </div>

  <!-- 奇闻趣事 -->
  <div class="box">
    <h2>エピソード・逸話</h2>
    <textarea v-model="selChar.sections.anecdotes" rows="4" placeholder="有趣的小故事、经典场景..."></textarea>
  </div>

  <!-- 自述 Q&A -->
  <div class="box">
    <h2>本人のコメント Q&A</h2>
    <div v-for="(qa, i) in selChar.sections.selfIntro" :key="i" class="qa-box">
      <button @click="selChar.sections.selfIntro.splice(i,1)" style="float:right;padding:2px 6px;font-size:10px">×</button>
      <div class="qa-q">Q: <input v-model="qa.q" placeholder="質問" style="width:calc(100% - 30px);border:none;border-bottom:2px solid #e74c3c;background:transparent"></div>
      <div class="qa-a">A: <textarea v-model="qa.a" rows="2" placeholder="回答" style="width:100%;margin-top:5px"></textarea></div>
      <input v-model="qa.source" placeholder="出处" style="font-size:11px;color:#666;margin-top:5px">
    </div>
    <button @click="selChar.sections.selfIntro.push({q:'',a:'',source:''})" style="margin-top:5px">+Q&A追加</button>
  </div>

  <!-- 随身物品 -->
  <div class="box">
    <h2>持ち物チェック</h2>
    <div v-for="(item, i) in selChar.itemsCheck" :key="i" style="display:flex;gap:5px;margin:3px 0;align-items:center">
      <input v-model="item.name" placeholder="物品名" style="flex:1">
      <input v-model="item.desc" placeholder="説明" style="flex:2">
      <button @click="selChar.itemsCheck.splice(i,1)">×</button>
    </div>
    <button @click="selChar.itemsCheck.push({name:'',desc:''})" style="margin-top:5px">+物品追加</button>
  </div>
</div>

<!-- 底部导航 -->
<div class="nav">
  <button @click="nav='schools'" :class="nav==='schools'?'on':''"><span class="ic">🏫</span>学校</button>
  <button @click="nav='chars';selChar=null" :class="nav==='chars'?'on':''"><span class="ic">🎾</span>選手</button>
  <button @click="selChar=null"><span class="ic">☰</span>リスト</button>
</div>
</div>
<script>
// Vue加载检测
if(typeof Vue==='undefined'){
  document.body.innerHTML='<div style="color:#e74c3c;padding:20px;text-align:center">⚠️ Vue.js加载失败，请检查网络</div>';
  throw new Error('Vue not loaded');
}

const {createApp,ref,watch}=Vue;

const baseProfileLabels={
  birthday:'生年月日',
  height:'身長',
  weight:'体重',
  bloodType:'血液型',
  playStyle:'プレースタイル',
  maker:'愛用メーカー',
  favoriteFood:'好物',
  subject:'得意科目',
  hobby:'趣味',
  family:'家族構成',
  fatherJob:'父の職業',
  color:'好きな色',
  type:'好みのタイプ'
};

createApp({
  setup(){
    const nav=ref('schools');
    const schools=ref(JSON.parse(localStorage.getItem('t_s')||'null')||[
      {id:'seigaku',name:'青春学園',captain:'手塚国光',motto:'質実剛健',description:'東京都の伝統校'},
      {id:'hyotei',name:'氷帝学園',captain:'跡部景吾',motto:'勝てば官軍',description:'名門私立'},
      {id:'rikkai',name:'立海大附属',captain:'幸村精市',motto:'常勝立海',description:'王者'}
    ]);
    const chars=ref(JSON.parse(localStorage.getItem('t_c')||'[]'));
    const selSchool=ref(null);
    const selChar=ref(null);
    
    // 初始化默认角色（完整结构）
    if(!chars.value.length){
      chars.value.push({
        id:'r1',
        schoolId:'seigaku',
        name:'越前リョーマ',
        baseProfile:{
          birthday:'12月24日',
          height:'151cm',
          weight:'50kg',
          bloodType:'O型',
          playStyle:'オールラウンダー',
          maker:'MIZUNO',
          favoriteFood:'焼き魚',
          subject:'英語',
          hobby:'スケート',
          family:'父・母・猫',
          fatherJob:'牧師',
          color:[{content:'銀',version:'10.5'}],
          type:[{content:'？',version:'10.5'}]
        },
        sections:{
          personality:'傲岸不遜だが、実力は本物。負けず嫌いで向上心が強い。',
          othersComments:[
            {author:'桃城武',text:'あのツラ、何回見てもムカつくぜ！',source:''},
            {author:'手塚国光',text:'学園の未来だ。',source:''}
          ],
          anecdotes:'アメリカJr.大会4連覇の実績を持つ。',
          selfIntro:[
            {q:'目標は？',a:'まだまだ上に行くよ。',source:''}
          ]
        },
        itemsCheck:[{name:'ラケット',desc:'愛用のMIZUNO'}]
      });
    }
    
    // 确保所有角色都有完整结构（兼容旧数据）
    chars.value.forEach(c=>{
      if(!c.baseProfile) c.baseProfile={};
      // 确保固定项目存在
      Object.keys(baseProfileLabels).forEach(key=>{
        if(!(key in c.baseProfile)){
          c.baseProfile[key] = ['color','type'].includes(key) ? [{content:'',version:''}] : '';
        }
      });
      if(!c.sections) c.sections={};
      if(!c.sections.personality) c.sections.personality='';
      if(!c.sections.othersComments) c.sections.othersComments=[];
      if(!c.sections.anecdotes) c.sections.anecdotes='';
      if(!c.sections.selfIntro) c.sections.selfIntro=[];
      if(!c.itemsCheck) c.itemsCheck=[];
    });
    
    const getChars=(sid)=>chars.value.filter(c=>c.schoolId===sid);
    const getSchoolName=(sid)=>(schools.value.find(s=>s.id===sid)||{}).name||'';
    
    const addChar=(sid)=>{
      const n=prompt('新しい選手の名前を入力してください：');
      if(!n) return;
      const newChar={
        id:'c'+Date.now(),
        schoolId:sid,
        name:n,
        baseProfile:Object.fromEntries(
          Object.keys(baseProfileLabels).map(k=>[k,['color','type'].includes(k)?[{content:'',version:''}]:''])
        ),
        sections:{
          personality:'',
          othersComments:[],
          anecdotes:'',
          selfIntro:[]
        },
        itemsCheck:[]
      };
      chars.value.push(newChar);
      selChar.value=newChar;
      save();
    };
    
    const save=()=>{
      localStorage.setItem('t_s',JSON.stringify(schools.value));
      localStorage.setItem('t_c',JSON.stringify(chars.value));
      alert('保存しました！');
    };
    
    watch([schools,chars],()=>{
      localStorage.setItem('t_s',JSON.stringify(schools.value));
      localStorage.setItem('t_c',JSON.stringify(chars.value));
    },{deep:true});
    
    return{
      nav,schools,chars,selSchool,selChar,
      baseProfileLabels,
      getChars,getSchoolName,addChar,save
    };
  }
}).mount('#app');
</script>
</body>
</html>
